# Gunakan perintah: docker compose up -d --build
services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: sate-jip-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/init:/docker-entrypoint-initdb.d
    networks:
      - sate-jip-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      network: host
    container_name: sate-jip-app-diskominfo
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env # Pastikan file ini berisi variabel untuk produksi
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sate-jip-network
    # Remove volumes for production - app is self-contained in the image
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits to prevent excessive resource consumption
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M


networks:
  sate-jip-network:
    driver: bridge

volumes:
  mysql-data:
