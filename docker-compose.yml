# Gunakan perintah: docker compose up -d --build
services:
  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: sate-jip-app-diskominfo
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env # Pastikan file ini berisi variabel untuk produksi
    environment:
      - NODE_ENV=production
    # Tidak ada volume untuk source code di produksi agar image bersifat immutable.
    networks:
      - sate-jip-network
      - .env
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
    # Remove volumes for production - app is self-contained in the image
    networks:
      - sate-jip-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  sate-jip-network:
    driver: bridge
