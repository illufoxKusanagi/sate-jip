# Docker Compose for PostgreSQL setup
# Usage: docker compose -f docker-compose.postgres.yml up -d
services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sate-jip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-sate_jip_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sate-jip-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: sate-jip-app-diskominfo
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - DB_TYPE=postgres
      - SKIP_DB_WAIT=false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sate-jip-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  sate-jip-network:
    driver: bridge

volumes:
  postgres-data:
